query ListReclamos @auth(level: USER) {
  reclamos(orderBy: [{ creadoEn: DESC }]) {
    id
    numero
    titulo
    descripcion
    estado
    prioridad
    lat
    lng
    direccion
    ciudadano
    dniCiudadano
    fecha
    motivoId
    motivoNombre
    canalEntrada
    creadoEn
    actualizadoEn
  }
}

query GetUsuario($firebaseUid: String!) @auth(level: USER) {
  usuario(key: { firebaseUid: $firebaseUid }) {
    firebaseUid
    email
    nombre
    rol
    creadoEn
  }
}

query GetRolPermisos($rol: String!) @auth(level: USER) {
  rolPermisos(key: { rol: $rol }) {
    id
    rol
    accesoAdmin
    verCapas
    editarCapas
    verLineas
    editarLineas
    verRutas
    editarRutas
    verReclamos
    editarReclamos
    gestionarGrupos
    gestionarUsuarios
  }
}

query GetUsuarioByEmail($email: String!) @auth(level: USER) {
  usuarios(where: { email: { eq: $email } }) {
    firebaseUid
    email
    nombre
    rol
    creadoEn
  }
}

query ListUsuarios @auth(level: USER) {
  usuarios(orderBy: [{ creadoEn: DESC }]) {
    firebaseUid
    email
    nombre
    rol
    creadoEn
  }
}
