query ListCapas @auth(level: USER) {
  capas {
    id
    nombre
    tipo
    color
    icono
    datosGeo
    visibilidad
    rolesPermitidos
    grupoId
    subGrupoId
    creadoEn
    actualizadoEn
    grupo {
      id
      nombre
      color
      visibilidad
      rolesPermitidos
    }
    subGrupo {
      id
      nombre
      color
    }
  }
}

query GetCapa($id: String!) @auth(level: USER) {
  capa(id: $id) {
    id
    datosGeo
    visibilidad
    rolesPermitidos
  }
}

query ListGrupos @auth(level: USER) {
  grupos {
    id
    nombre
    color
    visibilidad
    rolesPermitidos
  }
}

query ListSubGrupos @auth(level: USER) {
  subGrupos {
    id
    nombre
    color
    grupoId
  }
}

