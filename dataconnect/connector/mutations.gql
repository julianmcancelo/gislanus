mutation UpsertUsuario($firebaseUid: String!, $email: String!, $nombre: String, $rol: String) @auth(level: USER) {
  usuario_upsert(
    data: {
      firebaseUid: $firebaseUid
      email: $email
      nombre: $nombre
      rol: $rol
    }
  )
}

mutation CreateCapa(
  $nombre: String!
  $tipo: String!
  $color: String
  $icono: String
  $datosGeo: String!
  $visibilidad: String
  $rolesPermitidos: [String!]
  $grupoId: String
  $subGrupoId: String
) @auth(level: USER) {
  capa_insert(
    data: {
      nombre: $nombre
      tipo: $tipo
      color: $color
      icono: $icono
      datosGeo: $datosGeo
      visibilidad: $visibilidad
      rolesPermitidos: $rolesPermitidos
      grupoId: $grupoId
      subGrupoId: $subGrupoId
    }
  )
}

mutation UpdateCapa(
  $id: String!
  $nombre: String
  $tipo: String
  $color: String
  $icono: String
  $datosGeo: String
  $visibilidad: String
  $rolesPermitidos: [String!]
  $grupoId: String
  $subGrupoId: String
) @auth(level: USER) {
  capa_update(
    id: $id
    data: {
      nombre: $nombre
      tipo: $tipo
      color: $color
      icono: $icono
      datosGeo: $datosGeo
      visibilidad: $visibilidad
      rolesPermitidos: $rolesPermitidos
      grupoId: $grupoId
      subGrupoId: $subGrupoId
      actualizadoEn_expr: "request.time"
    }
  )
}

mutation DeleteCapa($id: String!) @auth(level: USER) {
  capa_delete(id: $id)
}

mutation CreateGrupo(
  $nombre: String!
  $color: String
  $visibilidad: String
  $rolesPermitidos: [String!]
) @auth(level: USER) {
  grupo_insert(
    data: {
      nombre: $nombre
      color: $color
      visibilidad: $visibilidad
      rolesPermitidos: $rolesPermitidos
    }
  )
}

mutation UpdateGrupo(
  $id: String!
  $nombre: String
  $color: String
  $visibilidad: String
  $rolesPermitidos: [String!]
) @auth(level: USER) {
  grupo_update(
    id: $id
    data: {
